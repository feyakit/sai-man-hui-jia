name: Build Cocos Web Mobile

on:
  pull_request:
    paths:
      - 'client/**'
      - 'package*.json'
      - 'tools/config/v1-levels.json'
      - 'tools/generate-v1-levels.ts'
      - 'tools/cocos/**'
      - '.github/workflows/cocos-web-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/trunk-cocos/creator.zip
          key: cocos-creator-win-3.8.8-121518
      - name: Build with Cocos Creator 3.8.8
        shell: pwsh
        run: ./tools/cocos/build-web-mobile.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocos-build-log
          path: |
            cocos-build.log
            cocos-diagnostics
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: trunk-home-web-mobile
          path: client/build/web-mobile
          if-no-files-found: error

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: trunk-home-web-mobile
          path: client/build/web-mobile
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Play both stages with mouse and touch
        run: node --import tsx tools/cocos/smoke-web-mobile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-mobile-browser-evidence
          path: tools/out/web-mobile-smoke
          if-no-files-found: ignore

      # Cloudflare Pages Direct Upload via Wrangler (task 0 recommendation, adopted by the
      # product side). All three values must be configured or the step skips without failing.
      # Secrets live in Settings > Secrets and variables > Actions; the project name is a
      # non-sensitive Repository Variable. Fork PRs cannot receive secrets, so previews are
      # only attempted for pushes/PRs from this repository.
      - name: Optional Cloudflare Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_PAGES_PROJECT_NAME:-}" ]]; then
            {
              echo 'Preview deployment skipped.'
              echo 'Configure repository secrets CLOUDFLARE_API_TOKEN (custom token with Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID, plus repository variable CLOUDFLARE_PAGES_PROJECT_NAME (name of an existing Direct Upload Pages project).'
              echo 'Recommended platform: Cloudflare Pages Direct Upload via Wrangler. Download trunk-home-web-mobile to play locally.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -o pipefail
          output=$(npx --yes wrangler@4.159.0 pages deploy client/build/web-mobile \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "pr-${{ github.event.pull_request.number }}" 2>&1) || {
              printf '%s\n' "$output" >> "$GITHUB_STEP_SUMMARY"
              echo 'Preview deployment failed; the trunk-home-web-mobile artifact remains downloadable.' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }
          printf '%s\n' "$output"
          preview_url=$(printf '%s\n' "$output" | grep -oE 'https://[^[:space:]]+' | grep -E '\.pages\.dev(/|$)' | tail -n1)
          if [[ -n "$preview_url" ]]; then
            echo "Preview: [Open playtest]($preview_url)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Preview deployed; the deployment URL was not present in the Wrangler output (see the log above).' >> "$GITHUB_STEP_SUMMARY"
          fi
