name: Build Cocos Web Mobile

on:
  pull_request:
    paths:
      - 'client/**'
      - 'package*.json'
      - 'tools/config/v1-levels.json'
      - 'tools/generate-v1-levels.ts'
      - 'tools/cocos/**'
      - '.github/workflows/cocos-web-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/trunk-cocos/creator.zip
          key: cocos-creator-win-3.8.8-121518
      - name: Build with Cocos Creator 3.8.8
        shell: pwsh
        run: ./tools/cocos/build-web-mobile.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocos-build-log
          path: |
            cocos-build.log
            cocos-diagnostics
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: trunk-home-web-mobile
          path: client/build/web-mobile
          if-no-files-found: error

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: trunk-home-web-mobile
          path: client/build/web-mobile
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Play both stages with mouse and touch
        run: node --import tsx tools/cocos/smoke-web-mobile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-mobile-browser-evidence
          path: tools/out/web-mobile-smoke
          if-no-files-found: ignore

      - name: Optional Netlify preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        shell: bash
        run: |
          if [[ -z "$NETLIFY_AUTH_TOKEN" || -z "$NETLIFY_SITE_ID" ]]; then
            echo 'Preview deployment skipped: configure NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID. Download trunk-home-web-mobile to play locally.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node tools/cocos/deploy-preview.mjs
